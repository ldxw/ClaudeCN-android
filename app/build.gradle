plugins {
    id 'com.android.application'
}

android {
    namespace 'com.host1syan.claudecn'
    compileSdk 34

    defaultConfig {
        applicationId "com.host1syan.claudecn"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.0.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
