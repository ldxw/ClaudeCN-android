name: Android Release

# 只在两种情况下构建：
#   1. 推送 v* 标签（如 v1.0.1）——自动构建并发布 Release
#   2. 在 Actions 页面手动触发——默认只产出构建产物，勾选 publish 才发布 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（如 1.0.2），留空则取 version.properties'
        required: false
        default: ''
      version_code:
        description: '版本号（整数），留空则由版本名推导（major*10000+minor*100+patch）'
        required: false
        default: ''
      publish:
        description: '构建完成后发布到 Releases 页面'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本名不再依赖 git 历史，但自动生成的发布说明需要完整提交与标签来分类
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK（platforms;android-34、build-tools;34.0.0），
      # 缺件时才补装，不依赖 android-actions/setup-android。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME 未设置，runner 镜像缺少 Android SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi

          install_if_missing() {
            local path="$1" pkg="$2"
            if [ -d "$ANDROID_HOME/$path" ]; then
              echo "已预装: $pkg"
              return 0
            fi
            echo "安装: $pkg"
            # yes 会因 sdkmanager 提前关管道收到 SIGPIPE，pipefail 下需容忍
            yes | sdkmanager --install "$pkg" >/dev/null || true
            if [ ! -d "$ANDROID_HOME/$path" ]; then
              echo "安装后仍缺少 $ANDROID_HOME/$path" >&2
              return 1
            fi
          }

          install_if_missing platforms/android-34 "platforms;android-34"
          install_if_missing build-tools/34.0.0 "build-tools;34.0.0"
          # 工程含一处 JNI（NativeAbi），需要 NDK 与 CMake。
          # ubuntu-latest 镜像已带 ndk;27.3.13750724 与 cmake;3.22.1，通常不会走到安装分支。
          install_if_missing ndk/27.3.13750724 "ndk;27.3.13750724"
          install_if_missing cmake/3.22.1 "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # versionName 的优先级：标签名 > 手动输入 > version.properties。
      # versionCode 默认不传，由 app/build.gradle 用 versionName 推导（major*10000+minor*100+patch），
      # 保证 CI 包与本地包同版本同 code；只有手动输入 version_code 时才覆盖。
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail

          file_name="$(sed -n 's/^versionName *= *//p' version.properties | tail -1)"
          if [ -z "${file_name}" ]; then
            echo "version.properties 缺少 versionName" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            source="标签 ${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION_NAME}" ]; then
            name="${INPUT_VERSION_NAME#v}"
            source="手动输入"
          else
            name="${file_name}"
            source="version.properties"
          fi

          case "${name}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            '') echo "版本名不能为空" >&2; exit 1 ;;
            *) echo "版本名需为 x.y.z 形式: ${name}" >&2; exit 1 ;;
          esac

          if [ -n "${INPUT_VERSION_CODE}" ]; then
            case "${INPUT_VERSION_CODE}" in
              *[!0-9]*) echo "版本号必须是整数: ${INPUT_VERSION_CODE}" >&2; exit 1 ;;
            esac
            code="${INPUT_VERSION_CODE}"
          else
            # 空值 = 不覆盖，交给 Gradle 从 versionName 推导
            code=""
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "版本: name=${name}（来源：${source}） code=${code:-由 versionName 推导}"

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          hand=".github/release-notes/v${{ steps.version.outputs.name }}.md"
          body="${RUNNER_TEMP}/release-body.md"
          if [ -f "$hand" ]; then
            cat "$hand" > "$body"
            echo "使用手写发布说明: $hand"
          else
            # body 留空会让 action 的正文与自动生成笔记拼接行为不明确，给一句占位说明
            echo "本次发布未提供手写要点，变更见下方自动生成内容。" > "$body"
            echo "未找到 $hand，使用占位说明 + 自动生成笔记"
          fi
          echo "body_path=${body}" >> "$GITHUB_OUTPUT"

      # 失败时用 ::error:: 写 annotation，无需登录也能在 Actions 页面看到具体原因。
      - name: Decode signing keystore
        env:
          # 两个名字都认：KEYSTORE_BASE64 是文档里的正式名，
          # KEYSTORE_B64 是本步骤历史变量名，照它建 secret 也能生效。
          B64_MAIN: ${{ secrets.KEYSTORE_BASE64 }}
          B64_ALT: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          KEYSTORE_B64="${B64_MAIN:-}"
          used="KEYSTORE_BASE64"
          if [ -z "${KEYSTORE_B64}" ] && [ -n "${B64_ALT:-}" ]; then
            KEYSTORE_B64="${B64_ALT}"
            used="KEYSTORE_B64"
          fi

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::签名 secret 缺失：KEYSTORE_BASE64 与 KEYSTORE_B64 都为空"
            echo "请到 Settings → Secrets and variables → Actions 添加其中一个，"
            echo "内容为单行 base64：base64 -w 0 my-release.jks（macOS 用 base64 -i my-release.jks）"
            exit 1
          fi
          echo "使用 secret: ${used}"

          # 容忍粘贴时带入的换行、空白，以及 data:...;base64, 前缀
          cleaned="$(printf '%s' "${KEYSTORE_B64}" | tr -d '\r\n\t ' | sed 's/^data:[^,]*,//')"
          echo "secret 原始长度 ${#KEYSTORE_B64} 字符，清洗后 ${#cleaned} 字符"

          if ! printf '%s' "${cleaned}" | base64 --decode > "${RUNNER_TEMP}/release.jks" 2>"${RUNNER_TEMP}/b64.err"; then
            echo "::error::KEYSTORE_BASE64 不是合法的 base64：$(cat "${RUNNER_TEMP}/b64.err")"
            exit 1
          fi

          size="$(stat -c %s "${RUNNER_TEMP}/release.jks")"
          if [ "${size}" -lt 1000 ]; then
            echo "::error::解码后仅 ${size} 字节，疑似 secret 内容被截断（完整 jks 通常 2 KB 以上）"
            exit 1
          fi

          echo "keystore 已写入 ${RUNNER_TEMP}/release.jks（${size} 字节）"

      # 签名材料缺任一项时 Gradle 会静默产出 unsigned 包且构建仍然成功，
      # 因此在这里提前拦下，避免把没签名的包发出去。
      - name: Check signing secrets
        env:
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${STORE_PW:-}" ] || missing="${missing} KEYSTORE_PASSWORD"
          [ -n "${ALIAS:-}" ]    || missing="${missing} KEY_ALIAS"
          [ -n "${KEY_PW:-}" ]   || missing="${missing} KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret:${missing}"
            exit 1
          fi
          echo "签名 secret 齐全（KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）"

      - name: Build release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease lintDebug

      # 五个包都收集：universal 供 Release 使用，四个 ABI 分包作为 workflow artifact。
      # 输出 path 只指向 universal，Publish release 因此仍只挂一个附件。
      - name: Collect release APKs
        id: apk
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release"
          ver="${{ steps.version.outputs.name }}"
          abis="arm64-v8a armeabi-v7a x86 x86_64"

          missing=""
          for abi in $abis; do
            [ -f "${src}/app-${abi}-release.apk" ] || missing="${missing} ${abi}"
          done
          if [ -n "$missing" ]; then
            echo "缺少 ABI 分包:${missing}" >&2
            find "$src" -type f >&2 || true
            exit 1
          fi
          if [ ! -f "${src}/app-universal-release.apk" ]; then
            echo "缺少 universal 包" >&2
            find "$src" -type f >&2 || true
            exit 1
          fi

          universal="ClaudeCN-${ver}-universal.apk"
          cp "${src}/app-universal-release.apk" "$universal"
          for abi in $abis; do
            cp "${src}/app-${abi}-release.apk" "ClaudeCN-${ver}-${abi}.apk"
          done

          apksigner="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          for f in ClaudeCN-${ver}-*.apk; do
            "$apksigner" verify "$f" >/dev/null
          done
          "$apksigner" verify --print-certs "$universal"
          sha256sum ClaudeCN-${ver}-*.apk

          echo "path=${universal}" >> "$GITHUB_OUTPUT"

      # 手动触发且未勾 publish 时上传全部五个包到 artifact；标签触发直接进 Release，不留 artifact。
      - name: Upload build artifacts
        if: github.ref_type != 'tag' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCN-${{ steps.version.outputs.name }}-apks
          path: ClaudeCN-${{ steps.version.outputs.name }}-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      # 标签推送必定发布；手动触发需显式勾选 publish
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ClaudeCN ${{ steps.version.outputs.name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          # 同一个标签重复发布时覆盖已有附件，避免失败
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: ${{ steps.apk.outputs.path }}
